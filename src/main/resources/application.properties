spring.application.name=mercado
spring.datasource.url=jdbc:postgresql://localhost:5432/supermercado
spring.datasource.username=postgres
spring.datasource.password=050510
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================
# 'validate': Hibernate solo verifica que tus tablas manuales coincidan con las clases @Entity.
# Si algo no coincide, te avisará al arrancar sin alterar la base de datos.
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect